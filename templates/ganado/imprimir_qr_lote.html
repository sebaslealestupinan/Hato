<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impresión Masiva de Aretes QR - HATO</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
        }

        .actions-bar {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-print {
            background-color: #00cba9;
            color: #111;
            font-weight: bold;
            font-size: 1.1em;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        .lote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .arete-card {
            width: 280px;
            height: 350px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            page-break-inside: avoid;
        }

        .arete-hole {
            width: 20px;
            height: 20px;
            background: #ddd;
            border: 2px solid #333;
            border-radius: 50%;
            position: absolute;
            top: 8px;
        }

        .arete-id {
            font-size: 1.8em;
            font-weight: 900;
            color: #000;
            margin-top: 15px;
        }

        .arete-qr {
            width: 140px;
            height: 140px;
        }

        .arete-footer {
            font-size: 0.85em;
            font-weight: bold;
            border-top: 1px dashed #666;
            width: 100%;
            padding-top: 5px;
            color: #222;
        }

        @media print {
            .actions-bar { display: none; }
            body { background: #fff; padding: 0; }
            .lote-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="actions-bar">
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Planilla de Aretes</button>
        <button onclick="window.location.href='/ganado/lista'" style="padding: 12px 18px; font-size: 1em; border-radius: 6px; cursor: pointer; background:#6c757d; color:#fff; border:none;">Volver a Lista</button>
    </div>

    <div class="lote-grid">
        {% for animal in ganados %}
            <div class="arete-card">
                <div class="arete-hole"></div>
                
                <div>
                    <div class="arete-id">{{ animal.identificacion }}</div>
                    {% if animal.nombre %}<div style="font-size:0.9em; color:#555;">{{ animal.nombre }}</div>{% endif %}
                </div>

                <img class="arete-qr" src="/ganado/qr/{{ animal.codigo_publico }}" alt="QR {{ animal.identificacion }}">

                <div class="arete-footer">
                    <div>{{ animal.finca.nombre }}</div>
                    <div>{{ animal.sexo }} | {{ animal.raza or 'Sin raza' }}</div>
                </div>
            </div>
        {% endfor %}
    </div>

</body>
</html>
