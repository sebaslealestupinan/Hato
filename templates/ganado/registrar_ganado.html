{% extends "base.html" %}

{% block head %}
    <title>Registrar Ganado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles_formularios.css"> 
{% endblock %}

{% block content %}
<div class="main-container">
    <div class="card">
        <h1><i class="fa-solid fa-cow"></i> Registrar Nuevo Animal</h1>
        <p class="form-message">Ingrese la información detallada del animal, ten presente que tienes que tener ya registro de la finca y del tipo de animal.</p>

        <!-- IMPORTANTE: enctype multipart/form-data -->
        <form id="registroGanadoForm" enctype="multipart/form-data">
            
            <label for="identificacion">Identificación / Arete:</label>
            <div class="input-group">
                <div class="icon-container"><i class="fa-solid fa-tag"></i></div>
                <input type="text" id="identificacion" placeholder="Identificación / Arete" required>
            </div>

            <label for="nombre">Nombre:</label>
            <div class="input-group">
                <div class="icon-container"><i class="fa-solid fa-pen-to-square"></i></div>
                <input type="text" id="nombre" placeholder="Nombre (opcional)">
            </div>

            <label for="raza">Raza:</label>
            <div class="input-group">
                <div class="icon-container"><i class="fa-solid fa-dna"></i></div>
                <input type="text" id="raza" placeholder="Raza (ej. Brahman, Holstein, Angus...)">
            </div>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <div class="input-group">
                <input type="date" id="fechaNacimiento" required> 
            </div>

            <label for="sexo">Sexo:</label>
            <div class="input-group select-wrapper"> 
                <select id="sexo" required>
                    <option value="" disabled selected>Selecciona el Sexo</option>
                    <option value="Macho">Macho</option>
                    <option value="Hembra">Hembra</option>
                </select>
            </div>

            <label for="estado">Estado del Animal:</label>
            <div class="input-group select-wrapper">
                <select id="estado" required>
                    <option value="Activo" selected>Activo</option>
                    <option value="Vendido">Vendido</option>
                    <option value="Fallecido">Fallecido/Muerto</option>
                    <option value="Descarte">Descarte</option>
                    <option value="Cuarentena">Cuarentena</option>
                </select>
            </div>

            <label for="finca">Finca Asignada:</label>
            <div class="input-group select-wrapper"> 
                <select id="finca" required>
                    <option value="" disabled selected>Selecciona la Finca</option>
                    {% for finca in fincas %}
                        <option value="{{ finca.id }}">{{ finca.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <label for="tipoAnimal">Tipo de Animal:</label>
            <div class="input-group select-wrapper"> 
                <select id="tipoAnimal" required>
                    <option value="" disabled selected>Selecciona el Tipo</option>
                    {% for tipo in tipos_animales %}
                        <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Genealogía -->
            <label for="madre_id">Madre (Hembra):</label>
            <div class="input-group select-wrapper">
                <select id="madre_id">
                    <option value="">-- Sin madre registrada / Desconocida --</option>
                    {% for h in hembras %}
                        <option value="{{ h.id }}">{{ h.identificacion }} {% if h.nombre %}({{ h.nombre }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <label for="padre_id">Padre (Macho):</label>
            <div class="input-group select-wrapper">
                <select id="padre_id">
                    <option value="">-- Sin padre registrado / Desconocido --</option>
                    {% for m in machos %}
                        <option value="{{ m.id }}">{{ m.identificacion }} {% if m.nombre %}({{ m.nombre }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Registro Sanitario al Nacer -->
            <label for="aplico_droga_nacimiento">Medicamentos / Drogas aplicadas al nacer:</label>
            <div class="input-group">
                <div class="icon-container"><i class="fa-solid fa-syringe"></i></div>
                <input type="text" id="aplico_droga_nacimiento" placeholder="Ej. Yodo en ombligo, Vitamina ADE, Suero (Opcional)">
            </div>

            <div>
                <label for="foto">Foto del Ganado:</label>
                <input type="file" id="foto" name="foto" accept="image/*">

                <div id="fotoPreviewBox" style="display:none; margin-top:10px; text-align:center;">
                    <img id="fotoPreview" alt="Vista previa"
                         style="max-width:220px; width:100%; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.3);">
                    <br>
                    <button type="button" id="quitarFoto"
                            style="margin-top:8px; background-color:#dc3545;">✖ Quitar foto</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrar Ganado</button>
        </form>
        <p id="mensaje" style="margin-top: 15px; text-align: center;"></p>
    </div>
</div>

<script>
const form = document.getElementById("registroGanadoForm");
const mensajeEl = document.getElementById("mensaje");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData();
    formData.append("identificacion", document.getElementById("identificacion").value.trim());
    formData.append("nombre", document.getElementById("nombre").value.trim() || '');
    formData.append("raza", document.getElementById("raza").value.trim() || '');
    formData.append("fecha_nacimiento", document.getElementById("fechaNacimiento").value);
    formData.append("sexo", document.getElementById("sexo").value);
    formData.append("estado", document.getElementById("estado").value);
    formData.append("finca_id", document.getElementById("finca").value);
    formData.append("tipo_animal_id", document.getElementById("tipoAnimal").value);
    
    const madreId = document.getElementById("madre_id").value;
    if (madreId) formData.append("madre_id", madreId);
    
    const padreId = document.getElementById("padre_id").value;
    if (padreId) formData.append("padre_id", padreId);
    
    const drogaNacimiento = document.getElementById("aplico_droga_nacimiento").value.trim();
    if (drogaNacimiento) formData.append("aplico_droga_nacimiento", drogaNacimiento);

    const fotoInput = document.getElementById("foto");
    if (fotoInput.files.length > 0) {
        formData.append("foto", fotoInput.files[0]);
    }

    const response = await fetch("/ganado/api/", {
        method: "POST",
        body: formData
    });

    if (response.ok) {
        const result = await response.json();
        mensajeEl.textContent = `✅ Animal "${result.identificacion}" registrado con éxito.`;
        mensajeEl.style.color = "#00cba9";
        form.reset(); 
    } else {
        const responseData = await response.json();
        let errorMessage = responseData.detail || "Error desconocido al registrar el ganado.";
        mensajeEl.textContent = `❌ ${errorMessage}`;
        mensajeEl.style.color = "#dc3545";
    }
});

// ---- Vista previa y botón "Quitar foto" ----
const inputFoto = document.getElementById("foto");
const previewBox = document.getElementById("fotoPreviewBox");
const previewImg = document.getElementById("fotoPreview");

function limpiarFoto() {
    inputFoto.value = "";
    if (previewImg.src.startsWith("blob:")) URL.revokeObjectURL(previewImg.src);
    previewImg.removeAttribute("src");
    previewBox.style.display = "none";
}

inputFoto.addEventListener("change", () => {
    const archivo = inputFoto.files[0];
    if (!archivo) return limpiarFoto();
    if (previewImg.src.startsWith("blob:")) URL.revokeObjectURL(previewImg.src);
    previewImg.src = URL.createObjectURL(archivo);
    previewBox.style.display = "block";
});

document.getElementById("quitarFoto").addEventListener("click", limpiarFoto);
form.addEventListener("reset", limpiarFoto);  // al registrar con éxito también se limpia la vista previa
</script>
{% endblock %}
